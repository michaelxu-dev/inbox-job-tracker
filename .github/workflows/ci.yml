name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        # The floor and something current. The floor was 3.9 and was pinned to
        # ubuntu-24.04 for a fortnight, because `ubuntu-latest` had rolled on
        # to 26.04 and setup-python has no 3.9 build for it - a pin that would
        # have needed renewing at every image retirement, for a Python that
        # went end of life in October 2025 and that the README had already
        # stopped claiming.
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - run: pytest -q
      # The demo needs no credentials, so it doubles as an end-to-end smoke test.
      - run: python -m inboxjobtracker.cli demo
      # The README documents the installed command too, so prove it exists.
      - run: inbox-job-tracker demo
